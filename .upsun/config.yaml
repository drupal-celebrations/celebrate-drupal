# Complete list of all available properties: https://docs.upsun.com/app/reference/
applications:
  celebrate-drupal:
    source:
      root: '/'

    # Static mode: the site is a frozen HTML export in /static (built by scripts/staticify.py),
    # served by nginx with no PHP runtime. Public files are still served from the files mount.
    # To go back to Drupal, revert the commit that introduced this.
    type: 'nodejs:22'

    mounts:
        '/web/sites/default/files':
            source: storage
            source_path: 'files'
        '/tmp':
            source: storage
            source_path: 'tmp'
        '/private':
            source: storage
            source_path: 'private'
        '/.drush':
            source: storage
            source_path: 'drush'
        '/drush-backups':
            source: storage
            source_path: 'drush-backups'

    web:
      commands:
        start: sleep infinity
      locations:
        '/':
            root: 'static'
            index: ['index.html']
            expires: 1h
            passthru: false
            scripts: false
            allow: true
        '/sites/default/files':
            root: 'web/sites/default/files'
            expires: 1h
            passthru: false
            scripts: false
            allow: true
            rules:
                '^/sites/default/files/(css|js)':
                    expires: 2w

    build:
      flavor: none

# Unused while static; kept so the data survives a rollback.
services:
  mariadb:
    type: mariadb:11.8

  redis:
    type: redis:8.0

routes:
  'https://{default}/':
    type: upstream
    upstream: 'celebrate-drupal:http'
    cache:
      enabled: true
      # Base the cache on the session cookie and custom Drupal cookies. Ignore all other cookies.
      cookies: ['/^SS?ESS/', '/^Drupal.visitor/']
    redirects:
      expires: 1d
      paths:
        '/files/drupalcon-prague-2022-photobooth.zip':
          to: 'https://{default}/sites/default/files/DrupalConPrague2022-photobooth.zip'
        # Formerly Drupal redirect module entries.
        '/2020/drupalcon-north-america/photo':
          to: 'https://{default}/2021/drupalcon-north-america/photo'
          code: 302
        '/drupalcon-europe-2021-official-photo':
          to: 'https://{default}/2021/drupalcon-europe-2021/official-photo'
        '/2020/drupalcon-europe-official-photo':
          to: 'https://{default}/2020/drupalcon-europe-2020/official-photo'

  'https://www.{default}':
    type: redirect
    to: 'https://{default}/'
