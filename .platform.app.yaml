# This file describes an application. You can have multiple applications
# in the same project.
#
# See https://docs.platform.sh/user_guide/reference/platform-app-yaml.html

# The name of this app. Must be unique within a project.
name: 'app'

# Static mode: the site is a frozen HTML export in /static (built by scripts/staticify.py),
# served by nginx with no PHP runtime. Public files are still served from the files mount.
# To go back to Drupal, revert the commit that introduced this.
type: 'nodejs:22'

# The size of the persistent disk of the application (in MB).
disk: 11048

# The 'mounts' describe writable, persistent filesystem mounts in the application.
mounts:
    '/web/sites/default/files':
        source: local
        source_path: 'files'
    '/tmp':
        source: local
        source_path: 'tmp'
    '/private':
        source: local
        source_path: 'private'
    '/.drush':
        source: local
        source_path: 'drush'
    '/drush-backups':
        source: local
        source_path: 'drush-backups'
    '/.console':
        source: local
        source_path: 'console'

build:
    flavor: none

web:
    commands:
        start: sleep infinity
    locations:
        '/':
            root: 'static'
            index: ['index.html']
            expires: 1h
            passthru: false
            scripts: false
            allow: true
        '/sites/default/files':
            root: 'web/sites/default/files'
            expires: 1h
            passthru: false
            scripts: false
            allow: true
            rules:
                '^/sites/default/files/(css|js)':
                    expires: 2w

# The configuration of scheduled execution.
crons:
    backup:
        spec: '0 4 * * *'
        cmd: |
            if [ "$PLATFORM_BRANCH" = master ]; then
                platform backup:create --yes --no-wait
            fi
    renewcert:
        spec: '0 2 2,16 * *'
        cmd: |
            if [ "$PLATFORM_BRANCH" = master ]; then
                platform redeploy --yes --no-wait
            fi
